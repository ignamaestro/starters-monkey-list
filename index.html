<html lang="en">
<head>
<meta charset="utf-8">

<body>
<title>Starters Monkey List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amaranth:wght@400;700&family=Bebas+Neue&family=Noto+Color+Emoji&display=swap">
<style>
/* Layout: una "diapositiva" a pantalla completa, como la presentación de Canva; todo escala con el lado menor (cqmin). */
:root{
  --sky:#abc8dd;        /* fondo azul claro de los Canva */
  --sky-deep:#8fb3cf;
  --ink:#1f2340;        /* contorno azul marino de los botones */
  --sun:#f6d04d;        /* amarillo de START / BACK / MENU */
  --sun-shadow:#d9a92a;
  --white:#ffffff;
  --orb:#4f8fe0;        /* flechas azules */
  --display:"Amaranth","Trebuchet MS",system-ui,sans-serif;
  --button:"Bebas Neue","Arial Narrow",Impact,sans-serif;
  --emoji:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky);color:var(--white);font-family:var(--display);overflow:hidden}
#app{position:relative;height:100%;container-type:size;padding-inline:16px;box-sizing:border-box}
.screen{position:absolute;inset:0;padding-inline:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5cqmin;text-align:center}
.screen[hidden]{display:none!important}
h1,h2{margin:0;font-weight:700;line-height:1.05;text-wrap:balance;text-shadow:0 .4cqmin 0 rgba(31,35,64,.12)}
.emoji{font-family:var(--emoji);line-height:1.1;font-weight:400}

/* Botones amarillos estilo Canva */
.pill{font-family:var(--button);letter-spacing:.12em;color:var(--ink);background:var(--sun);border:.55cqmin solid var(--ink);border-radius:999px;box-shadow:0 .9cqmin 0 var(--sun-shadow);cursor:pointer;padding:.6em 1.6em .45em;line-height:1;transition:transform .12s}
.pill:hover{transform:translateY(-.3cqmin)}
.pill:active{transform:translateY(.5cqmin);box-shadow:0 .3cqmin 0 var(--sun-shadow)}
.pill:focus-visible,.orb:focus-visible,.tile:focus-visible,.icon-btn:focus-visible,.art:focus-visible{outline:.6cqmin solid var(--ink);outline-offset:.6cqmin}
.rect{font-family:var(--display);font-weight:700;color:#c0392b;background:var(--sun);border:.5cqmin solid #e2b400;border-radius:.4cqmin;box-shadow:0 .9cqmin 0 #b7a24a;padding:.45em 1.1em;cursor:pointer;letter-spacing:.02em}

/* Portada */
#start h1{font-size:11cqmin}
#start .sub{font-size:7.5cqmin;font-weight:700}
#start .mascot{height:30cqmin;width:auto;max-width:100%;animation:wave 2.4s ease-in-out infinite;transform-origin:50% 90%;filter:drop-shadow(0 .8cqmin 0 rgba(31,35,64,.12))}
#start .pill{font-size:7cqmin}
@keyframes wave{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}

/* Menú de temas */
#menu{justify-content:flex-start;padding-block:4cqmin}
#menu h2{font-size:9cqmin}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2.6cqmin;width:min(100%,150cqmin);flex:1;align-content:center}
.tile{background:var(--white);border:none;border-radius:3cqmin;box-shadow:0 .9cqmin 0 var(--sky-deep);padding:1.6cqmin 1cqmin;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.6cqmin;transition:transform .15s;min-width:0}
.tile:hover{transform:translateY(-.6cqmin) rotate(-1deg)}
.tile .emoji{font-size:9cqmin}
.tile .lbl{font-family:var(--display);font-weight:700;font-size:3.6cqmin;line-height:1.05;color:var(--c,#e0457b);text-wrap:balance}
.tile .num{font-family:var(--button);font-size:2.8cqmin;letter-spacing:.1em;color:var(--ink);opacity:.55}
@container (max-aspect-ratio: 1/1){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.tile .lbl{font-size:4.2cqmin}}

/* Portada de tema */
#cover h2{font-size:12cqmin}
#cover .big{font-size:30cqmin}
#cover .count{font-family:var(--button);letter-spacing:.12em;font-size:4cqmin;color:var(--ink);opacity:.6}
#cover .rect{font-size:5cqmin}
#cover .back{position:absolute;left:5cqw;top:50%;transform:translateY(-50%);font-size:5.5cqmin}
#cover .back:hover{transform:translateY(-55%)}

/* Diapositiva de palabra */
#slide{justify-content:space-between;padding-block:5cqmin 4cqmin}
#slide h2{font-size:9cqmin;max-width:min(100%,92cqw);overflow-wrap:anywhere}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqmin;min-height:0;width:100%}
.art{background:none;border:none;padding:0;cursor:pointer;display:grid;place-items:center;min-height:0}
.art .emoji{font-size:34cqmin;white-space:nowrap;display:block}
.art .emoji.many{font-size:22cqmin}
.art.speaking{animation:bob .9s ease-in-out infinite}
@keyframes bob{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.numeral{font-family:var(--display);font-weight:700;font-size:38cqmin;line-height:1;color:var(--white);-webkit-text-stroke:1cqmin var(--ink);paint-order:stroke fill}
.swatch{width:34cqmin;height:34cqmin;border-radius:50%;border:1cqmin solid var(--white);box-shadow:0 1.2cqmin 0 rgba(31,35,64,.18)}
.name-tag{font-size:26cqmin}
svg.draw{width:40cqmin;height:34cqmin;display:block}

/* Escenas de preposiciones */
.scene{position:relative;width:62cqmin;height:40cqmin}
.scene .crate{position:absolute;bottom:0;width:34%;height:52%;background:#c98a4b;border:.8cqmin solid #7a4b22;border-radius:1.2cqmin;box-sizing:border-box;z-index:2}
.scene .crate::after{content:"";position:absolute;inset:18% 12% auto;height:.8cqmin;background:#7a4b22;opacity:.55;border-radius:1cqmin}
.scene .pet{position:absolute;font-family:var(--emoji);font-size:16cqmin;line-height:1;z-index:3}
.scene .table{position:absolute;inset:0;width:100%;height:100%;z-index:2}

.dots{display:flex;gap:1.6cqmin}
.dots i{width:2.4cqmin;height:2.4cqmin;border-radius:50%;background:var(--white);opacity:.45;transition:opacity .2s,transform .2s}
.dots i.on{opacity:1;background:var(--sun);transform:scale(1.25);box-shadow:0 0 0 .4cqmin var(--ink)}

.orb{position:absolute;top:50%;transform:translateY(-50%);width:13cqmin;height:13cqmin;border-radius:50%;border:.6cqmin solid #2c63b5;background:radial-gradient(circle at 35% 30%,#d9ebff 0 18%,#8cbcf3 40%,var(--orb) 75%,#2c63b5 100%);box-shadow:0 .8cqmin 1.6cqmin rgba(31,35,64,.25);cursor:pointer;display:grid;place-items:center;padding:0}
.orb svg{width:55%;height:55%}
.orb:hover{filter:brightness(1.08)}
.orb:disabled{opacity:.35;cursor:default}
.orb.prev{left:5cqw}.orb.next{right:5cqw}

.bar{display:flex;align-items:center;justify-content:space-between;width:100%;gap:2cqmin}
.bar .pill{font-size:4cqmin}
.counter{font-family:var(--button);letter-spacing:.12em;font-size:4cqmin;color:var(--ink);opacity:.65;font-variant-numeric:tabular-nums}
.icon-btn{background:var(--white);border:.5cqmin solid var(--ink);border-radius:999px;width:9cqmin;height:9cqmin;display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 .7cqmin 0 var(--sky-deep)}
.icon-btn svg{width:58%;height:58%}
.right-tools{display:flex;align-items:center;gap:2cqmin}

.corner{position:absolute;top:2.5cqmin;right:2.5cqmin;z-index:5;width:7cqmin;height:7cqmin}
.toast{position:absolute;left:50%;bottom:2cqmin;transform:translateX(-50%);background:var(--ink);color:var(--white);font-family:var(--display);font-size:3cqmin;padding:.6em 1em;border-radius:1.5cqmin;max-width:90%;z-index:6}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <button class="icon-btn corner" id="fs" type="button" aria-label="Pantalla completa">
    <svg viewBox="0 0 24 24" fill="none" stroke="#1f2340" stroke-width="2.6" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>

  <section class="screen" id="start">
    <h1>Cambridge English</h1>
    <div class="sub">Pre A1 Starters · Monkey List</div>
    <img class="mascot" src="monkey.png" alt="" aria-hidden="true">
    <button class="pill" id="go" type="button">START</button>
  </section>

  <section class="screen" id="menu" hidden>
    <h2>TOPICS</h2>
    <div class="grid" id="grid"></div>
  </section>

  <section class="screen" id="cover" hidden>
    <button class="pill back" id="back" type="button">BACK ◂</button>
    <h2 id="coverTitle"></h2>
    <div class="big emoji" id="coverEmoji" aria-hidden="true"></div>
    <div class="count" id="coverCount"></div>
    <button class="rect" id="cont" type="button">CONTINUE</button>
  </section>

  <section class="screen" id="slide" hidden>
    <h2 id="word"></h2>
    <div class="stage">
      <button class="art" id="art" type="button" aria-label="Escuchar otra vez"></button>
      <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
    <button class="orb prev" id="prev" type="button" aria-label="Palabra anterior"><svg viewBox="0 0 24 24"><path d="M15 5 7 12l8 7" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="orb next" id="next" type="button" aria-label="Palabra siguiente"><svg viewBox="0 0 24 24"><path d="M9 5l8 7-8 7" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="bar">
      <button class="pill" id="toMenu" type="button">MENU</button>
      <div class="right-tools">
        <span class="counter" id="counter"></span>
        <button class="icon-btn" id="replay" type="button" aria-label="Escuchar 3 veces">

        </button>
      </div>
    </div>
  </section>

  <div class="toast" id="toast" hidden></div>
</div>

function parse(block){
  return block.trim().split('\n').map(l=>{
    const [en,es,img,say]=l.split('|').map(s=>s&&s.trim());
    const o={en,es,say:say||en};
    if(img.startsWith('pos:')){o.kind='pos';o.val=img.slice(4);}
    else if(img.startsWith('svg:')){o.kind='svg';o.val=img.slice(4);}
    else if(img.startsWith('name:')){o.kind='name';o.val=img.slice(5);}
    else {o.kind='emoji';o.val=img;}
    return o;
  });
}

stand|ponerse de pie|🙆
talk|hablar|💬
teacher|profesor / profesora|🧑‍🏫
word|palabra|🔡
write|escribir|✍️`)},
];
const ALL = {title:'All words',emoji:'🔀',c:'#1f2340',shuffle:true,words:TOPICS.flatMap(t=>t.words)};
const MENU = [...TOPICS, ALL];

/* ===== Estado y pantallas ===== */
const $ = id=>document.getElementById(id);
const screens=['start','menu','cover','slide'];
let topic=null, list=[], idx=0;
function show(id){screens.forEach(s=>$(s).hidden=(s!==id)); if(id!=='slide') stopAll();}

$('grid').innerHTML = MENU.map((t,i)=>`<button class="tile" type="button" data-i="${i}" style="--c:${t.c}">
  <span class="emoji" aria-hidden="true">${t.emoji}</span>
  <span class="lbl">${t.title}</span>
  <span class="num">${t.n?('UNIT '+t.n+' · '):''}${t.words.length} WORDS</span></button>`).join('');
$('grid').addEventListener('click',e=>{const b=e.target.closest('.tile'); if(b) openTopic(MENU[+b.dataset.i]);});

function openTopic(t){
  topic=t;
  list = t.shuffle ? shuffle([...t.words]) : t.words;
  $('coverTitle').textContent = t.title.toUpperCase();
  $('coverEmoji').textContent = t.emoji;
  $('coverCount').textContent = (t.n?('UNIT '+t.n+' · '):'') + list.length + ' WORDS';
  show('cover');
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function artHTML(w){
  switch(w.kind){
    case 'num': return `<span class="numeral">${w.val}</span>`;
    case 'color': return `<span class="swatch" style="background:${w.val}"></span>`;
    case 'svg': return SVG[w.val];
    case 'name': return `<span class="emoji name-tag">${w.val}</span>`;
    case 'pos': return scene(w.val);
    default: {
      const many=[...new Intl.Segmenter().segment(w.val)].length>2;
      return `<span class="emoji${many?' many':''}">${w.val}</span>`;
    }
  }
}
function scene(p){
  const crate=(l,b='0',w='34%',h='52%')=>`<span class="crate" style="left:${l};bottom:${b};width:${w};height:${h}"></span>`;
  const pet=(l,b,z=3,fs='16cqmin')=>`<span class="pet" style="left:${l};bottom:${b};z-index:${z};font-size:${fs};transform:translateX(-50%)">🐱</span>`;
  const map={
    in:    crate('33%')+pet('50%','33%',1),
    on:    crate('33%')+pet('50%','49%'),
    next:  crate('12%')+pet('70%','0'),
    between: crate('0%')+crate('66%')+pet('50%','0'),
    behind: crate('28%','0','38%','60%')+pet('64%','34%',1,'15cqmin'),
    front: crate('28%','22%','44%','64%')+pet('50%','0',3,'17cqmin'),
    under: `<svg class="table" viewBox="0 0 100 60" preserveAspectRatio="none"><rect x="2" y="0" width="96" height="7" rx="2" fill="#a0612e"/><rect x="8" y="7" width="6" height="53" fill="#7a4b22"/><rect x="86" y="7" width="6" height="53" fill="#7a4b22"/></svg>`
           + pet('50%','0',3,'14cqmin')
  };
  return `<span class="scene">${map[p]}</span>`;
}

function renderSlide(){
  const w=list[idx];
  $('word').textContent = (w.en+'-'+w.es).toUpperCase();
  $('art').innerHTML = artHTML(w);
  $('art').setAttribute('aria-label','Escuchar "'+w.en+'" otra vez');
  $('counter').textContent = (idx+1)+' / '+list.length;
  $('prev').disabled = idx===0;
  $('next').disabled = idx===list.length-1;
  play(w);
  preload(list[idx+1]);
}
function go(d){const n=idx+d; if(n<0||n>=list.length) return; idx=n; renderSlide();}

/* ===== Audio: archivo propio si existe, si no voz del navegador; siempre 3 veces ===== */
let token=0, curAudio=null, voice=null;
const slug=s=>s.toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function pickVoice(){
  const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  const en=vs.filter(v=>/^en[-_]/i.test(v.lang));
  const pref=[/Sonia|Libby|Maisie|Ryan.*Natural/i,/Google UK English Female/i,/Google UK English/i,/Natural/i];
  voice=null;
  for(const r of pref){voice=en.find(v=>/en[-_]GB/i.test(v.lang)&&r.test(v.name))||null; if(voice)break;}
  voice = voice || en.find(v=>/en[-_]GB/i.test(v.lang)) || en.find(v=>/en[-_]US/i.test(v.lang)) || en[0] || null;
}
if(window.speechSynthesis){pickVoice(); speechSynthesis.onvoiceschanged=pickVoice;}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function speakOnce(text){
  return new Promise(res=>{
    if(!window.speechSynthesis){res();return;}
    const u=new SpeechSynthesisUtterance(text);
    if(voice){u.voice=voice;u.lang=voice.lang;} else u.lang='en-GB';
    u.rate=.8; u.pitch=1.05;
    let done=false; const fin=()=>{if(!done){done=true;res();}};
    u.onend=fin; u.onerror=fin;
    setTimeout(fin, 900+text.length*220);   // red de seguridad si el navegador no avisa del final
    speechSynthesis.speak(u);
  });
}
function playFile(src,t){
  return new Promise(res=>{
    const a=new Audio(src); curAudio=a;
    a.onended=res; a.onerror=()=>res('error');
    a.onloadedmetadata=()=>{
      const seg=Math.max(.3,(a.duration-2.4)/3);   // 3 repeticiones con 1,2 s de pausa
      [0,seg+1.2,2*seg+2.4].forEach((s,i)=>setTimeout(()=>{if(t===token)setDots(i);},s*1000));
    };
    a.play().catch(()=>res('error'));
  });
}
function preload(w){ if(!SPRITE && w && AUDIO_FILES.has(slug(w.en))){ const a=new Audio(); a.preload='auto'; a.src='audio/'+slug(w.en)+'.mp3'; } }
let spriteEl=null;
function playSprite(seg,t){
  return new Promise(res=>{
    if(!spriteEl){ spriteEl=new Audio(SPRITE.src); spriteEl.preload='auto'; }
    const a=spriteEl, [start,dur]=seg; curAudio=a;
    const one=Math.max(.3,(dur-2.4)/3);
    let ended=false; const fin=r=>{ if(ended) return; ended=true; a.pause(); a.removeEventListener('timeupdate',tu); res(r); };
    const tu=()=>{ if(a.currentTime>=start+dur+.05) fin(); };
    a.addEventListener('timeupdate',tu);
    const go=()=>{
      try{ a.currentTime=start; }catch(e){ fin('error'); return; }
      a.play().then(()=>{
        [0,one+1.2,2*one+2.4].forEach((s,i)=>setTimeout(()=>{if(t===token)setDots(i);},s*1000));
        setTimeout(()=>fin(),(dur+.15)*1000);
      }).catch(()=>fin('error'));
    };
    if(a.readyState>=1) go(); else { a.addEventListener('loadedmetadata',go,{once:true}); a.addEventListener('error',()=>fin('error'),{once:true}); a.load(); }
    const chk=setInterval(()=>{ if(t!==token){ clearInterval(chk); fin('stop'); } else if(ended) clearInterval(chk); },100);
  });
}
function stopAll(){
  token++;
  try{speechSynthesis.cancel();}catch(e){}
  if(curAudio){curAudio.pause();curAudio=null;}
  setDots(-1); $('art').classList.remove('speaking');
}
function setDots(k){document.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i===k));}
async function play(w){
  stopAll(); const t=token;
  $('art').classList.add('speaking');
  await sleep(300);
  if(t!==token) return;
  let ok=false;
  const k=slug(w.en);
  if(SPRITE && SPRITE.map[k]) ok = (await playSprite(SPRITE.map[k],t))!=='error';
  else if(!SPRITE && AUDIO_FILES.has(k)) ok = (await playFile('audio/'+k+'.mp3',t))!=='error';
  if(!ok){
    for(let i=0;i<REPEATS;i++){
      if(t!==token) return;
      setDots(i);
      await speakOnce(w.say||w.en);
      if(t!==token) return;
      if(i<REPEATS-1) await sleep(GAP_MS);
    }
  }
  if(t===token){setDots(-1); $('art').classList.remove('speaking');}
}

/* ===== Controles ===== */
$('go').onclick=()=>{ if(window.speechSynthesis){speechSynthesis.cancel(); pickVoice();} show('menu'); };
$('back').onclick=()=>show('menu');
$('toMenu').onclick=()=>show('menu');
$('cont').onclick=()=>{idx=0; show('slide'); renderSlide();};
$('prev').onclick=()=>go(-1);
$('next').onclick=()=>go(1);
$('art').onclick=()=>play(list[idx]);
$('replay').onclick=()=>play(list[idx]);
$('fs').onclick=async()=>{
  try{ if(document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); }
  catch(e){ toast('Tu navegador no permite pantalla completa aquí.'); }
};
document.addEventListener('keydown',e=>{
  if($('slide').hidden) { if(e.key==='Enter' && !$('cover').hidden) $('cont').click(); return; }
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1);}
  else if(e.key===' '&&e.target===document.body){e.preventDefault();play(list[idx]);}
  else if(e.key==='Escape'){show('menu');}
});
// Deslizar con el dedo en tablet
let sx=null;
$('slide').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
$('slide').addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60)go(dx<0?1:-1);sx=null;});
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3500);}
if(false) toast('Este navegador no tiene voz: ábrelo en Chrome o Edge.');
</script>
